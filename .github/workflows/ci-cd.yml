name: ☕ Deploy Java — Backend Servers

on:
  push:
    branches:
      - main
      - feat/pipe-main
    # paths:
    #   - 'backend/**'   # ajuste para o caminho da sua pasta Maven
  workflow_dispatch:

defaults:
  run:
    working-directory: basilios   # ajuste se necessário

jobs:
  # ============================================================
  # JOB 1: Build Maven (runner GitHub-hosted)
  # ============================================================
  build:
    name: 🔨 Build Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Diagnóstico
        run: |
          echo "PWD: $(pwd)"
          echo "pom.xml existe: $(ls pom.xml 2>/dev/null || echo 'NÃO ENCONTRADO')"
          find $GITHUB_WORKSPACE -name "pom.xml" | head -5

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build com Maven 
        run: mvn clean package -Dmaven.test.skip=true --batch-mode
        # Para rodar os testes, remova -DskipTests acima

      - name: Renomear JAR para nome fixo
        run: |
          # Garante que o artefato sempre se chame app.jar independente da versão
          JAR_FILE=$(find target -name "*.jar" -not -name "*sources*" | head -1)
          echo "JAR encontrado: $JAR_FILE"
          cp "$JAR_FILE" target/app.jar

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: basilios/target/app.jar
          retention-days: 1

